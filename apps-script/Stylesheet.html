<style>
  /* Theme variables: light by default; OS dark mode via
     prefers-color-scheme; a forced mode wins via data-theme on <html>
     (same scheme as the Flask dashboard, same localStorage key). */
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --muted: #666666;
    --small: #555555;
    --border: #dddddd;
    --th-bg: #f5f5f5;
    --btn-bg: #e9e9e9;
    --btn-fg: #000000;
    --input-bg: #ffffff;
    --ok: #1e8449;
    --fail: #c0392b;
    --warn: #b58900;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212;
      --fg: #e0e0e0;
      --muted: #aaaaaa;
      --small: #aaaaaa;
      --border: #444444;
      --th-bg: #2a2a2a;
      --btn-bg: #333333;
      --btn-fg: #e0e0e0;
      --input-bg: #1e1e1e;
      --ok: #4caf7d;
      --fail: #e57373;
      --warn: #e0b13c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212;
    --fg: #e0e0e0;
    --muted: #aaaaaa;
    --small: #aaaaaa;
    --border: #444444;
    --th-bg: #2a2a2a;
    --btn-bg: #333333;
    --btn-fg: #e0e0e0;
    --input-bg: #1e1e1e;
    --ok: #4caf7d;
    --fail: #e57373;
    --warn: #e0b13c;
  }
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 1100px; padding: 0 1rem; background: var(--bg); color: var(--fg); }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid var(--border); padding: 0.45rem 0.6rem; text-align: left; vertical-align: top; }
  th { background: var(--th-bg); }
  td small { color: var(--small); }
  .muted { color: var(--muted); }
  .status-ok { color: var(--ok); }
  .status-fail { color: var(--fail); }
  .status-unknown { color: var(--warn); }
  .status-none { color: var(--muted); }
  button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; margin-right: 0.5rem; background: var(--btn-bg); color: var(--btn-fg); border: 1px solid var(--border); }
  button:disabled { cursor: default; opacity: 0.5; }
  textarea { background: var(--input-bg); color: var(--fg); border: 1px solid var(--border); }
  #progress { margin-top: 1rem; min-height: 1.2em; }
</style>
